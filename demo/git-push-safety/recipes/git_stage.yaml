version: "1.0.0"
title: "Stage Git Changes"
description: "Capture staged changes and diff summary for a git repository."

parameters:
  - key: work_dir
    input_type: string
    requirement: required
    description: "Working directory of the git repository"

instructions: |
  You are a git operations assistant.
  You MUST respond with ONLY a valid JSON object, no other text or markdown.

prompt: |
  Simulate staging changes in a git repository at: {{ work_dir }}

  Assume the following files have been modified:
  - engine/orchestrate.sh (modified)
  - ontology/sbpmn.ttl (modified)  
  - README.md (new file)

  Respond with ONLY this JSON (no markdown, no explanation):
  {"files_staged": 3, "diff_lines": 47, "files": ["engine/orchestrate.sh", "ontology/sbpmn.ttl", "README.md"]}
