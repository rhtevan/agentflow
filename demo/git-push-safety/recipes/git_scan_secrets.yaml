version: "1.0.0"
title: "Scan for Secrets and PII"
description: "Scan staged git diff for secrets, API keys, PII, and hardcoded paths."

parameters:
  - key: files_staged
    input_type: string
    requirement: required
    description: "Number of files staged"
  - key: files
    input_type: string
    requirement: required
    description: "List of staged files"

instructions: |
  You are a security scanner for git repositories.
  You MUST respond with ONLY a valid JSON object, no other text or markdown.

prompt: |
  Scan the following staged files for security issues:
  Files: {{ files }}
  Count: {{ files_staged }}

  Check for: secrets, API keys, hardcoded user paths, IP addresses, PII.

  Simulate finding one hardcoded path issue in engine/orchestrate.sh.
  Respond with ONLY this JSON (no markdown, no explanation):
  {"findings_count": 1, "findings": [{"category": "Hardcoded Path", "file": "engine/orchestrate.sh", "line": 42, "match": "/home/user/.agents/skills/", "severity": "WARNING"}]}
